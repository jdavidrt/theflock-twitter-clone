# Serves the built SPA and proxies /api to the Go server (D-42/D-70). The client keeps calling
# relative /api/*, so no frontend code changes between dev (Vite proxy) and Docker (this proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy the API. The upstream host is resolved at request time via Docker's embedded DNS
    # (127.0.0.11) so nginx starts even before `server` is reachable and keeps running across
    # server restarts, returning 502 instead of crashing. $request_uri keeps the /api prefix,
    # which the Go routes expect (GET /api/health, POST /api/auth/login, ...).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://server:3000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: React Router deep links (/login, /profile/alice, ...) serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
