name: CI

on:
  push:
    branches: [main]
  pull_request:

# D-37: the Go job enforces the D-32 coverage threshold on every push; the client job runs
# lint, format check, build and tests. E2E is not in CI (D-36).
jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      COVERAGE_MIN: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      # D-66: store/sqlite runs the same conformance suite as store/memory (covered by the
      # "go test (race)" step above via internal/store/sqlite's own _test.go), and from Step 11
      # on the httpapi integration tests also run against both stores.
      - name: go test (httpapi against sqlite)
        run: HTTPAPI_TEST_STORE=sqlite go test ./internal/httpapi/...

      - name: coverage (server/internal, threshold ${{ env.COVERAGE_MIN }}%)
        run: |
          go test ./internal/... -coverpkg=./internal/... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "total statement coverage: ${total}%"
          awk -v total="$total" -v min="$COVERAGE_MIN" 'BEGIN { exit (total + 0 >= min + 0) ? 0 : 1 }' \
            || { echo "::error::coverage ${total}% is below the ${COVERAGE_MIN}% threshold (D-32)"; exit 1; }

  client:
    name: Client (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: lint (eslint)
        run: npx eslint .

      - name: format check
        run: npm run format:check

      - name: build
        run: npm run build:client

      - name: test
        run: npm run test:client

  docker:
    name: Docker Compose (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships Docker + Compose v2. Build both images and bring the stack up,
      # waiting for the server's /api/health healthcheck (D-70). No .env in CI, so the stack
      # boots on its compose defaults (APP_ENV=development, placeholder secret).
      - name: compose up --build --wait
        run: docker compose up --build --wait --wait-timeout 180

      # Both probes go through nginx on 5173: the SPA at / and the proxied API health endpoint,
      # so the client image, the nginx /api proxy and the server are all exercised.
      - name: smoke test through nginx
        run: |
          curl --fail --show-error --silent http://localhost:5173/ -o /dev/null
          curl --fail --show-error --silent http://localhost:5173/api/health

      - name: compose logs on failure
        if: failure()
        run: docker compose logs

      - name: compose down
        if: always()
        run: docker compose down -v
